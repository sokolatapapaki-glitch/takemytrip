<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <title>Reel outro</title>
    <link rel="stylesheet" href="./outro.css" />
  </head>
  <body>
    <div id="stage">
      <!-- the scene, bottom to top -->
      <div id="headline"></div>

      <svg id="globe" width="1080" height="1920" viewBox="0 0 1080 1920">
        <defs>
          <radialGradient id="ocean" cx="38%" cy="32%" r="75%">
            <stop offset="0%" stop-color="#9fd4f2" />
            <stop offset="100%" stop-color="#4f9fd4" />
          </radialGradient>
          <radialGradient id="shine" cx="34%" cy="28%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>
        </defs>
        <ellipse id="globe-shadow" />
        <circle id="globe-ocean" fill="url(#ocean)" />
        <path id="globe-graticule" />
        <path id="globe-land" />
        <circle id="globe-shine" fill="url(#shine)" />
        <circle id="globe-limb" />
        <g id="trail"></g>
        <!--
          Two flat silhouettes of the same aircraft, cross-faded on `profile` so
          the pair reads as one solid object turning in space:

            side   full profile — fuselage, tail fin, wing. Shown when the plane
                   flies across the frame. Squashed along its own length as it
                   turns away, which IS the foreshortening.
            axial  what is left when it points at (or away from) the camera:
                   fuselage end-on, wings spread wide, fin up. Not rotated with
                   the heading — at the limbs the plane is climbing the screen
                   while aimed at the viewer, and level wings is what that looks
                   like.

          Both are drawn nose along +x, centred on the origin, so the heading
          rotation is `angle` with no glyph-orientation offset to remember.
        -->
        <g id="plane">
          <g id="plane-side">
            <path
              d="M10.5 0C9-1.9 6-2.6 1-2.6h-9.5c-1.5 0-2.3 1-2.3 2.2v1.6c0 .9.7 1.4 1.6 1.4H1c5 0 8-.7 9.5-2.6z
                 M-7.6-2.6l2.4-5.8h1.8l-1 5.8z
                 M0.6 2.4l-3.8 5.2h2.6l3.8-5.2z"
            />
          </g>
          <g id="plane-axial">
            <path
              d="M0-2.4a2.4 2.4 0 100 4.8 2.4 2.4 0 100-4.8z
                 M-11 0.4l8.8-1.1h4.4L11 0.4v1.5l-8.8-.5h-4.4L-11 1.9z
                 M-0.9-2.4l.6-4.6h.6l.6 4.6z"
            />
          </g>
        </g>
      </svg>

      <div id="tagline"></div>

      <!-- the plan preview, sliding up and away over the scene -->
      <img id="preview" alt="" />
    </div>

    <script>
      // Pure DOM writes: every value comes from scene.ts, per frame.
      const NS = "http://www.w3.org/2000/svg";
      const $ = (id) => document.getElementById(id);
      let words = [];

      function circle(el, cx, cy, r) {
        el.setAttribute("cx", cx);
        el.setAttribute("cy", cy);
        el.setAttribute("r", r);
      }

      window.__reelOutro = {
        async init(s) {
          const g = s.globe;
          for (const id of ["globe-ocean", "globe-shine", "globe-limb"]) circle($(id), g.cx, g.cy, g.r);
          const sh = $("globe-shadow");
          sh.setAttribute("cx", g.cx);
          sh.setAttribute("cy", g.cy + g.r + 46);
          sh.setAttribute("rx", g.r * 0.8);
          sh.setAttribute("ry", 26);

          const h = $("headline");
          h.textContent = "";
          words = s.headline.map((w) => {
            const el = document.createElement("span");
            el.className = "word";
            el.textContent = w;
            h.appendChild(el);
            return el;
          });
          $("tagline").textContent = s.tagline;

          const img = $("preview");
          img.src = s.previewUrl;
          await img.decode();
        },

        render(f) {
          $("preview").style.transform = `translateY(${f.slideY}px)`;
          $("preview").style.display = f.slideY <= -1920 ? "none" : "";

          $("globe-land").setAttribute("d", f.land);
          $("globe-graticule").setAttribute("d", f.graticule);

          $("trail").innerHTML = f.trail
            .map(
              (d) =>
                `<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="7" fill-opacity="${d.opacity.toFixed(3)}"/>`
            )
            .join("");

          const plane = $("plane");
          if (f.plane) {
            const p = f.plane;
            const s = 4.2 * p.scale;
            // Both sprites sit at the plane's position, at its size. Only the
            // side view carries the heading rotation.
            plane.setAttribute(
              "transform",
              `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) scale(${s.toFixed(3)})`
            );
            plane.style.opacity = String(p.opacity);

            // Side view: rotated to the heading, squashed along its own length
            // by the real foreshortening.
            $("plane-side").setAttribute(
              "transform",
              `rotate(${p.angle.toFixed(2)}) scale(${p.squashX.toFixed(3)} 1)`
            );
            // The two opacities sum to 1, so the pair never goes translucent
            // part-way through the turn.
            $("plane-side").style.opacity = p.sideMix.toFixed(3);
            $("plane-axial").style.opacity = (1 - p.sideMix).toFixed(3);
          } else {
            plane.style.opacity = "0";
          }

          words.forEach((el, i) => {
            const w = f.words[i];
            el.style.transform = `scale(${w.scale})`;
            el.style.opacity = String(w.opacity);
          });
          const t = $("tagline");
          t.style.opacity = String(f.tagline.opacity);
          t.style.transform = `translateY(${f.tagline.dy}px)`;
        },

        /** Same guard as the caption overlay, plus Latin for the headline. */
        async ensureFont() {
          try {
            await document.fonts.load('700 76px "ReelSans"');
            await document.fonts.ready;
          } catch {
            return false;
          }
          if (!document.fonts.check('700 76px "ReelSans"')) return false;
          const c = document.createElement("canvas").getContext("2d");
          c.font = '700 76px "ReelSans"';
          const tofu = c.measureText("￾".repeat(9)).width;
          const greek = c.measureText("ΟΡΓΑΝΩΣΕ!").width;
          const latin = c.measureText("TAKEMYTRP").width;
          return greek > 0 && Math.abs(greek - tofu) > 1 && Math.abs(latin - tofu) > 1;
        },
      };
    </script>
  </body>
</html>
