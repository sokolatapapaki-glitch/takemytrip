<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <title>Reel outro</title>
    <link rel="stylesheet" href="./outro.css" />
  </head>
  <body>
    <div id="stage">
      <!-- the scene, bottom to top -->
      <div id="headline"></div>

      <svg id="globe" width="1080" height="1920" viewBox="0 0 1080 1920">
        <defs>
          <radialGradient id="ocean" cx="38%" cy="32%" r="75%">
            <stop offset="0%" stop-color="#9fd4f2" />
            <stop offset="100%" stop-color="#4f9fd4" />
          </radialGradient>
          <radialGradient id="shine" cx="34%" cy="28%" r="60%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>
        </defs>
        <ellipse id="globe-shadow" />
        <circle id="globe-ocean" fill="url(#ocean)" />
        <path id="globe-graticule" />
        <path id="globe-land" />
        <circle id="globe-shine" fill="url(#shine)" />
        <circle id="globe-limb" />
        <g id="trail"></g>
        <!--
          The airliner: a low-poly 3D model (reels/outro/plane.ts), projected and
          shaded in Node, handed over as screen-space polygons far-to-near.
          Painted twice — first fattened in the outline colour, which only shows
          round the silhouette, then the faces themselves on top. That second
          pass is what gives it the bold cartoon outline without any per-edge
          silhouette maths.
        -->
        <g id="plane">
          <g id="plane-outline"></g>
          <g id="plane-body"></g>
        </g>
        </g>
        </g>
      </svg>

      <div id="tagline"></div>

      <!-- the plan preview, sliding up and away over the scene -->
      <img id="preview" alt="" />
    </div>

    <script>
      // Pure DOM writes: every value comes from scene.ts, per frame.
      const NS = "http://www.w3.org/2000/svg";
      const $ = (id) => document.getElementById(id);
      let words = [];

      function circle(el, cx, cy, r) {
        el.setAttribute("cx", cx);
        el.setAttribute("cy", cy);
        el.setAttribute("r", r);
      }

      window.__reelOutro = {
        async init(s) {
          const g = s.globe;
          for (const id of ["globe-ocean", "globe-shine", "globe-limb"]) circle($(id), g.cx, g.cy, g.r);
          const sh = $("globe-shadow");
          sh.setAttribute("cx", g.cx);
          sh.setAttribute("cy", g.cy + g.r + 46);
          sh.setAttribute("rx", g.r * 0.8);
          sh.setAttribute("ry", 26);

          const h = $("headline");
          h.textContent = "";
          words = s.headline.map((w) => {
            const el = document.createElement("span");
            el.className = "word";
            el.textContent = w;
            h.appendChild(el);
            return el;
          });
          $("tagline").textContent = s.tagline;

          const img = $("preview");
          img.src = s.previewUrl;
          await img.decode();
        },

        render(f) {
          $("preview").style.transform = `translateY(${f.slideY}px)`;
          $("preview").style.display = f.slideY <= -1920 ? "none" : "";

          $("globe-land").setAttribute("d", f.land);
          $("globe-graticule").setAttribute("d", f.graticule);

          $("trail").innerHTML = f.trail
            .map(
              (d) =>
                `<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="7" fill-opacity="${d.opacity.toFixed(3)}"/>`
            )
            .join("");

          const plane = $("plane");
          if (f.plane) {
            const p = f.plane;
            plane.style.opacity = String(p.opacity);
            const ol = $("plane-outline");
            ol.setAttribute("stroke-width", p.outlineW.toFixed(2));
            ol.innerHTML = p.polys
              .filter((q) => q.outline)
              .map((q) => `<polygon points="${q.pts}"/>`)
              .join("");
            const body = $("plane-body");
            body.setAttribute("stroke-width", p.edgeW.toFixed(2));
            body.innerHTML = p.polys
              .map((q) => `<polygon points="${q.pts}" fill="${q.fill}" stroke="${q.edge}"/>`)
              .join("");
          } else {
            plane.style.opacity = "0";
          }

          words.forEach((el, i) => {
            const w = f.words[i];
            el.style.transform = `scale(${w.scale})`;
            el.style.opacity = String(w.opacity);
          });
          const t = $("tagline");
          t.style.opacity = String(f.tagline.opacity);
          t.style.transform = `translateY(${f.tagline.dy}px)`;
        },

        /** Same guard as the caption overlay, plus Latin for the headline. */
        async ensureFont() {
          try {
            await document.fonts.load('700 76px "ReelSans"');
            await document.fonts.ready;
          } catch {
            return false;
          }
          if (!document.fonts.check('700 76px "ReelSans"')) return false;
          const c = document.createElement("canvas").getContext("2d");
          c.font = '700 76px "ReelSans"';
          const tofu = c.measureText("￾".repeat(9)).width;
          const greek = c.measureText("ΟΡΓΑΝΩΣΕ!").width;
          const latin = c.measureText("TAKEMYTRP").width;
          return greek > 0 && Math.abs(greek - tofu) > 1 && Math.abs(latin - tofu) > 1;
        },
      };
    </script>
  </body>
</html>
